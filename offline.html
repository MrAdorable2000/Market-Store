<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5a4">
<title>Offline · Isoko Ryacu</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172525;background:#f7faf9}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(460px,100%);padding:32px 24px;text-align:center;background:#fff;border:1px solid #dfe9e7;border-radius:24px;box-shadow:0 16px 50px rgba(0,0,0,.08)}
img{width:76px;height:76px;object-fit:contain;margin-bottom:12px}
h1{margin:0 0 10px;font-size:28px}
p{margin:0 0 22px;color:#60716f;line-height:1.6}
button{border:0;border-radius:12px;padding:12px 18px;background:#0ea5a4;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<img src="./assets/images/logo/pwa-192.png" alt="Isoko Ryacu">
<h1>You are offline</h1>
<p>Reconnect to the internet and try again. Your saved marketplace app will return to the page when the connection is available.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
